<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <title>我的房屋记录</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app">
    <header class="top"><h1>我的房屋记录</h1><button id="clear" class="quiet" type="button">清空</button></header>
    <main id="view" aria-label="查看模式"></main>
    <form id="edit" hidden autocomplete="off">
      <section class="card"><h2>房屋资料</h2><label>团队名字<input name="team" type="text"></label><label>小区名字<input name="estate" type="text"></label><label>小区详细地址<textarea name="address" rows="2"></textarea></label></section>
      <section class="card"><h2>联系人</h2><label>中介名字<input name="agent" type="text"></label><label>中介电话<input name="agentPhone" type="tel"></label><label>房东电话<input name="landlordPhone" type="tel"></label></section>
      <section class="card"><h2>租户资料</h2><label>租户名字<input name="tenant" type="text"></label><div class="field-label">证件类型</div><div class="segments" data-field="idType"><button type="button" data-value="护照">护照</button><button type="button" data-value="身份证">身份证</button></div><label id="idNumberLabel">护照号码<input name="idNumber" type="text"></label><div class="field-label">证件图片</div><div class="image-actions"><button id="pickImage" class="secondary" type="button">选择图片</button><button id="removeImage" class="quiet" type="button" hidden>删除</button></div><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><img id="editImage" class="photo" alt="证件图片预览" hidden></section>
      <section class="card"><h2>租房资料</h2><div class="field-label">WiFi</div><div class="segments" data-field="wifi"><button type="button" data-value="包">包</button><button type="button" data-value="不包">不包</button></div><label>每月缴租日<select name="rentDay"><option value=""></option></select></label><label>房屋到期日期<input name="expiry" type="date"></label></section>
      <section class="card"><h2>房租付款</h2><label>银行<input name="bank" type="text"></label><label>账户名字<input name="accountName" type="text"></label><label>银行账号<input name="accountNumber" type="text" inputmode="numeric"></label></section>
      <section class="card"><h2>押金</h2><label>租房押金<input name="rentDeposit" type="text" inputmode="decimal"></label><label>水电押金<input name="utilityDeposit" type="text" inputmode="decimal"></label><label>总共缴纳<input name="totalDeposit" type="text" inputmode="decimal"></label></section>
      <section class="card"><h2>租房合同</h2><label>合同链接<input name="contract" type="url"></label><div class="link-actions"><button class="secondary" type="button" data-action="open">打开</button><button class="secondary" type="button" data-action="copy">复制</button></div></section>
    </form>
  </div>
  <nav class="bottom" aria-label="操作"><div class="bottom-inner"><button id="leftAction" class="secondary" type="button">编辑</button><button id="rightAction" class="primary" type="button">导出</button></div></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
